name: Build & deploy to GitHub Pages

# Every branch is built and published:
#   main            -> https://<owner>.github.io/<repo>/
#   any other branch -> https://<owner>.github.io/<repo>/branches/<branch-slug>/
# All builds live side by side on the `gh-pages` branch, which GitHub Pages serves.
on:
  push:
    branches: ['**', '!gh-pages']
  delete:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Compute paths
        id: paths
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then ROOT="/"; else ROOT="/${REPO}/"; fi
          if [[ "$BRANCH" == "${{ github.event.repository.default_branch }}" ]]; then
            DEST="."; BASE="$ROOT"
          else
            DEST="branches/${SLUG}"; BASE="${ROOT}branches/${SLUG}/"
          fi
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io${BASE}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.paths.outputs.base }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: ${{ steps.paths.outputs.dest }}
          keep_files: true
          commit_message: 'Deploy ${{ github.ref_name }} @ ${{ github.sha }}'

      - name: Make sure Pages serves the gh-pages branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1 \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
            || echo "::warning::Enable Pages manually: Settings → Pages → Deploy from a branch → gh-pages / (root)"

      - name: Summary
        run: echo "Deployed **${GITHUB_REF_NAME}** to ${{ steps.paths.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

  # Remove the published copy of a branch when the branch is deleted.
  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove branch build
        run: |
          SLUG=$(echo "${{ github.event.ref }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')
          if [ -d "branches/$SLUG" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git rm -rq "branches/$SLUG"
            git commit -m "Remove build for deleted branch ${{ github.event.ref }}"
            git push
          fi
